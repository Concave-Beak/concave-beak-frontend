<div id="home-page-banner" class="home-page-banner vignette">

  <div class="banner-media">
    <img src="{{imageUrl}}">
  </div>

  <div class="banner-text">
    <div class="home-page-banner-header">{{title}}</div>
    <div class="home-page-banner-description">{{description}}</div>
  </div>

</div>

<div class="home-page-article-container">
  <div class="home-page-article-header">
    recent articles
  </div>
  <div id="home-page-articles-list"></div>
</div>

<template id="home-page-articles-template">
  <div class="home-page-article">
    <a href="/{{link}}" class="home-page-article-thumbnail smooth-edges-img-sm">
      <img src="{{imageUrl}}">
    </a>
    <div class="home-page-article-text">
      <a href="/{{link}}" class="home-page-article-title">{{title}}</a>
      <div class="home-page-article-snippet">{{snippet}}</div>
      <div class="home-page-article-date">{{lastUpdate}}</div>
      <a href="/{{link}}" class="home-page-article-read-more">Read More</a>
    </div>
  </div>
</template>
